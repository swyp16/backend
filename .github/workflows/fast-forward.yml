name: 승격 FF

# 승격 PR(develop → production, production → main)과 핫픽스 PR(hotfix/{이슈 키} → production)에 "/ff" 댓글을 달면
# base 브랜치를 PR head 로 FF 한다. 핫픽스는 develop 에도 합친다.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  fast-forward:
    if: >-
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/ff')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: fast-forward-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: GitHub App 토큰
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FF_APP_CLIENT_ID }}
          private-key: ${{ secrets.FF_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: 확인 후 FF
        # 댓글 본문과 작성자는 환경변수로만 넘긴다.
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT: ${{ github.event.comment.body }}
          PROMOTION_APPROVALS: 0
          HOTFIX_APPROVALS: 2
        run: |
          set -euo pipefail
          fail() {
            gh pr comment "$PR" -R "$REPO" --body "FF 하지 않았다: $1"
            echo "::error::$1"
            exit 1
          }

          if [ "$(printf '%s\n' "$COMMENT" | head -n 1 | tr -d '[:space:]')" != "/ff" ]; then
            echo "/ff 명령이 아니다"; exit 0
          fi

          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write) ;;
            *) echo "::error::$ACTOR 에게 쓰기 권한이 없다"; exit 1 ;;
          esac

          pr=$(gh api "repos/$REPO/pulls/$PR")
          state=$(printf '%s' "$pr" | jq -r .state)
          base=$(printf '%s' "$pr" | jq -r .base.ref)
          head=$(printf '%s' "$pr" | jq -r .head.ref)
          head_sha=$(printf '%s' "$pr" | jq -r .head.sha)
          head_repo=$(printf '%s' "$pr" | jq -r .head.repo.full_name)
          [ "$state" = open ] || fail "열린 PR 이 아니다"
          [ "$head_repo" = "$REPO" ] || fail "같은 저장소의 브랜치만 FF 한다"
          if [ "$head>$base" = "develop>production" ] || [ "$head>$base" = "production>main" ]; then
            kind=promotion; required=$PROMOTION_APPROVALS; need_checks="check"
          elif printf '%s' "$head" | grep -Eq '^hotfix/[0-9]+-[0-9]+$' && { [ "$base" = production ] || [ "$base" = develop ]; }; then
            kind=hotfix; required=$HOTFIX_APPROVALS; need_checks="check naming CodeRabbit"
          else
            fail "승격 PR(develop → production, production → main)과 핫픽스 PR(hotfix/{이슈 키} → production, develop)만 FF 한다: $head → $base"
          fi
          # develop 으로 오는 핫픽스 PR 은 production 을 합친 브랜치(되합치기 충돌을 푼 것)만 받는다.
          if [ "$kind>$base" = "hotfix>develop" ]; then
            prod_sha=$(gh api "repos/$REPO/git/ref/heads/production" --jq .object.sha) || fail "production 을 읽지 못했다"
            st=$(gh api "repos/$REPO/compare/$prod_sha...$head_sha" --jq .status) || st=error
            case "$st" in
              ahead | identical) ;;
              *) fail "develop 으로는 production 을 합친 핫픽스 브랜치만 FF 한다" ;;
            esac
          fi

          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
            --jq '.[] | select(.state != "COMMENTED" and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
              | [.user.login, .state] | @tsv' \
            | awk -F '\t' '{ last[$1] = $2 } END { for (u in last) print last[u] }')
          if printf '%s\n' "$reviews" | grep -qx CHANGES_REQUESTED; then
            fail "변경 요청이 남아 있다"
          fi
          approvals=$(printf '%s\n' "$reviews" | grep -cx APPROVED || true)
          [ "$approvals" -ge "$required" ] || fail "승인 ${approvals}명, ${required}명 필요"

          # ponytail: 대화는 앞 100개만 본다. PR 하나에 100개를 넘기면 페이지를 넘긴다.
          unresolved=$(gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) { reviewThreads(first: 100) { nodes { isResolved } } }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length')
          [ "$unresolved" = 0 ] || fail "해결하지 않은 대화가 ${unresolved}개 있다"

          # 같은 이름의 체크는 가장 최근 것만 본다. 디스코드 알림(notify)은 반영 조건이 아니다.
          runs=$(gh api --paginate --slurp "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
            | jq '[.[].check_runs[] | select(.name != "notify")] | group_by([.app.id, .name]) | map(max_by(.id))')
          not_passed=$(printf '%s' "$runs" | jq -r '.[]
            | select(.status != "completed" or ((.conclusion | IN("success", "neutral", "skipped")) | not))
            | "\(.name)(\(.conclusion // .status))"')
          [ -z "$not_passed" ] || fail "통과하지 않은 체크: $(printf '%s' "$not_passed" | tr '\n' ' ')"
          for c in $need_checks; do
            [ "$(printf '%s' "$runs" | jq --arg c "$c" '[.[] | select(.name == $c and .conclusion == "success")] | length')" -ge 1 ] \
              || fail "$c 가 이 커밋에서 통과한 기록이 없다"
          done
          status=$(gh api "repos/$REPO/commits/$head_sha/status" --jq '"\(.total_count) \(.state)"')
          [ "${status%% *}" = 0 ] || [ "${status#* }" = success ] || fail "커밋 상태가 ${status#* } 이다"

          base_sha=$(gh api "repos/$REPO/git/ref/heads/$base" --jq .object.sha)
          compare=$(gh api "repos/$REPO/compare/$base_sha...$head_sha" --jq '"\(.status) \(.behind_by)"')
          case "$compare" in
            "ahead 0") ;;
            identical*) fail "$base 가 이미 같은 커밋이다" ;;
            *) fail "FF 할 수 없다($compare). $base 가 $head 의 조상이 아니다" ;;
          esac

          gh api -X PATCH "repos/$REPO/git/refs/heads/$base" -f sha="$head_sha" -F force=false > /dev/null \
            || fail "$base 갱신이 거부됐다"

          msg="FF 했다: $base → $(printf '%s' "$head_sha" | cut -c1-7)"

          # production 에 들어간 핫픽스는 develop 에도 합친다. 다음 승격이 FF 되도록 핫픽스 커밋은 그대로 둔다.
          if [ "$kind>$base" = "hotfix>production" ]; then
            dev_sha=$(gh api "repos/$REPO/git/ref/heads/develop" --jq .object.sha) || dev_sha=
            sync=$(gh api "repos/$REPO/compare/$dev_sha...$head_sha" --jq .status) || sync=error
            synced=true
            case "$sync" in
              ahead) gh api -X PATCH "repos/$REPO/git/refs/heads/develop" -f sha="$head_sha" -F force=false > /dev/null || synced=false ;;
              diverged) gh api -X POST "repos/$REPO/merges" -f base=develop -f head="$head_sha" \
                -f commit_message="Merge $head into develop" > /dev/null || synced=false ;;
              behind | identical) ;;
              *) synced=false ;;
            esac
            if [ "$synced" = false ]; then
              gh pr comment "$PR" -R "$REPO" --body "$msg. develop 에는 합치지 못했다. develop 에서 $head 를 다시 만들어 production 을 merge 하고, develop 으로 PR 을 올려 /ff 한다."
              echo "::error::develop 에 합치지 못했다"
              exit 1
            fi
            msg="$msg. develop 에도 합쳤다"
          fi
          gh pr comment "$PR" -R "$REPO" --body "$msg"
