name: CI

on:
  pull_request:
  push:
    branches: [develop, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gradle-wrapper.jar 를 먼저 검증하고, Gradle 캐시는 setup-java 로 한다.
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      # Checkstyle, ArchUnit, 테스트(Testcontainers), 실행 jar 빌드
      - run: ./gradlew check bootJar
