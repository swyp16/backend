name: 이름 규칙

# develop 으로 오는 PR 과 production 으로 오는 핫픽스 PR 의 브랜치 이름, PR 제목, 커밋 메시지를 검사한다.
# 커밋마다 이슈 키를 넣는다. 머지 커밋은 검사하지 않는다. PR 제목을 고치면 다시 검사한다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: naming-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  naming:
    if: github.base_ref == 'develop' || (github.base_ref == 'production' && startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 브랜치·PR 제목·커밋 이름 규칙
        # 브랜치 이름과 PR 제목은 환경변수로만 넘긴다.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^(feature|hotfix)/[0-9]+-[0-9]+$'; then
            echo "브랜치 이름이 규칙과 다르다: $HEAD_REF (feature/{이슈 키} 또는 hotfix/{이슈 키}, 예: feature/14-38)"; exit 1
          fi
          key=${HEAD_REF#*/}
          case "$PR_TITLE" in
            "[$key] "?*) ;;
            *) echo "PR 제목이 규칙과 다르다: $PR_TITLE ([{이슈 키}] 요약, 예: [$key] 요약)"; exit 1 ;;
          esac
          # CodeRabbit 은 이 문구가 든 제목을 승격 PR 로 보고 리뷰하지 않는다.
          if printf '%s' "$PR_TITLE" | grep -Eqi 'develop to production|production to main'; then
            echo "PR 제목에 승격 PR 제목(Develop to production, Production to main)을 넣지 않는다: $PR_TITLE"; exit 1
          fi
          log=$(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          bad=$(printf '%s\n' "$log" | grep -Ev '^[0-9a-f]+ (feat|fix|refactor|test|docs|chore)\([0-9]+-[0-9]+\): .+' || [ $? -eq 1 ])
          if [ -n "$bad" ]; then
            echo "커밋 메시지가 규칙과 다르다 ({타입}({이슈 키}): 요약, 예: feat(14-38): 엔티티 공통 규칙 추가):"
            echo "$bad"
            exit 1
          fi
          echo "브랜치·PR 제목·커밋 이름 규칙 통과"
